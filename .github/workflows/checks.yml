name: Infopanel checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q lcd install.py tests
      - run: sh -n install.sh update.sh
      - run: python lcd/preview_infopanel.py --output /tmp/infopanel-preview
